spring.application.name=MultiMailSender
server.port=8080

# Random pause between two mails (ms) to avoid being rate limited
mail.cooldown.minMs=${MAIL_COOLDOWN_MIN_MS:1000}
mail.cooldown.maxMs=${MAIL_COOLDOWN_MAX_MS:5000}

# Max successful mails per sender per day (Gmail allows ~500). 0 disables the check.
mail.daily-limit=${MAIL_DAILY_LIMIT:450}

# Where job reports and the sent log are stored
mail.data-dir=${MAIL_DATA_DIR:data}

mail.smtp.host=${MAIL_SMTP_HOST:smtp.gmail.com}
mail.smtp.port=${MAIL_SMTP_PORT:587}

# Comma separated list of origins allowed to call the API
mail.cors.allowed-origins=${MAIL_CORS_ORIGINS:http://localhost:4200}

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=30MB
